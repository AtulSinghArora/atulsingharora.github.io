  <script>
    const markdownUrl = "https://raw.githubusercontent.com/AtulSinghArora/atulsingharora.github.io/master/webpage.md";
    const markdownUrl_qm = "https://raw.githubusercontent.com/quantum-iiit/quantum-iiit.github.io/refs/heads/main/content.md";
    // const headingToExtract = "## Recent"; // <-- change this

    async function loadSection(headingToExtract, contentID, inputUrl = markdownUrl) {
      const res = await fetch(inputUrl);
      const text = await res.text();

      // Determine heading level from the string (count #)
      const level = headingToExtract.match(/^#+/)[0].length;

      // Regex: match from headingToExtract until next heading of same or higher level
      const regex = new RegExp(
        `${headingToExtract}[\\s\\S]*?(?=\\n#{1,${level}}\\s|$)`,
        "i"
      );

      const match = text.match(regex);
      let section = match ? match[0] : "Section not found.";

      section = section.replace(/^.*\n/, "");

      // Convert markdown → HTML
      const html = marked.parse(section);

      // Inject into page
      document.getElementById(contentID).innerHTML += html;
    }
  </script>

  <script>
    const sections = document.querySelectorAll("h2");
    const menuContainer = document.getElementById("menuLinks");

    // Generate ID if not present, then build menu link
    sections.forEach((section, index) => {
      let id = section.id;
      if (!id) {
        // Generate id from text content
        id = section.textContent.toLowerCase().trim().replace(/\s+/g, '-').replace(/[^a-z0-9\-]/g, '');
        section.id = id;
      }

      const link = document.createElement("a");
      link.href = `#${id}`;
      link.textContent = section.textContent;
      link.className = "menu-link";
      menuContainer.appendChild(link);
    });

    function highlightMenu() {
      const scrollPosition = window.scrollY + window.innerHeight / 3;
      let currentSectionId = "";

      if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 2) {
        currentSectionId = sections[sections.length - 1].id;
      } else {
        sections.forEach(section => {
          if (scrollPosition >= section.offsetTop) {
            currentSectionId = section.id;
          }
        });
      }

      const menuLinks = document.querySelectorAll(".menu-link");
      menuLinks.forEach(link => {
        link.classList.toggle("active", link.getAttribute("href") === `#${currentSectionId}`);
      });
    }

    window.addEventListener("scroll", highlightMenu);
    window.addEventListener("load", () => {
      highlightMenu();

      // Close mobile menu on link click
      document.querySelectorAll(".menu-link").forEach(link => {
        link.addEventListener("click", () => {
          document.getElementById("menuLinks").classList.remove("show");
        });
      });
    });

    function toggleMenu() {
      document.getElementById("menuLinks").classList.toggle("show");
    }
  </script>
